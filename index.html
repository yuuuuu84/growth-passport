<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f0f2f5;
    color: #333;

}
h1 {

}
.container {
    max-width: 1400px;

    display: flex;
    gap: 24px;
    align-items: flex-start;
}
.form-panel {
    width: 420px;
    background: #fff;
    border-radius: 16px;
    padding: 24px;

}
.preview-panel {
    flex: 1;

.page-tab {

}
.page-tab:hover {

}

.field-group {

}
.field-item label {

    color: #555;
    margin-bottom: 6px;
}
.field-item input[type="text"],

    font-size: 14px;

.field-item input[type="text"]:focus,

.preview-title {

.preview-title::before {
    content: "";

    margin-right: 10px;

    border-radius: 2px;

#previewCanvas {
    width: 100%;

    border: 2px solid #e8e8e8;
}
.action-buttons {
    margin-top: 20px;

    gap: 12px;
    flex-wrap: wrap;
}
.btn {

    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
}
.btn-primary {
    background: #2c5c4c;
    color: #fff;
}
.btn-primary:hover {
    background: #1e4235;
}
.btn-success {
    background: #4caf50;

}
.btn-success:hover {

}
.btn-secondary {
    background: #f0f0f0;
    color: #333;
}

    background: #e0e0e0;
}
.page-hidden { display: none; }

@media (max-width: 768px) {

    }

    }
    .preview-panel {
        width: 100%;
        padding: 16px;

    }
    .page-tabs {
        gap: 6px;

    }
    .page-tab {

    .action-buttons {

    }
    .preview-title {
        font-size: 16px;
        margin-bottom: 12px;
    }
    .field-group h3 {
        font-size: 15px;
    }
}
</style>

<script>
const pageImages = {};
const canvas = document.getElementById('previewCanvas');
const ctx = canvas.getContext('2d');
let currentPage = 1;
let finalPdf = null;
let userPhoto = null;

function generatePDF() {
    const img1 = pageImages[1];
    if (!img1) {
        alert('图片加载中，请稍候...');
        return;
    }
    const { jsPDF } = window.jspdf;
    const w = img1.naturalWidth;
    const h = img1.naturalHeight;
    const pdf = new jsPDF({
        orientation: w > h ? 'landscape' : 'portrait',
        unit: 'px',
        format: [w, h]
    });

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = w;
    tempCanvas.height = h;
    const tctx = tempCanvas.getContext('2d');

    for (let i = 1; i <= 5; i++) {
        tctx.clearRect(0, 0, w, h);
        drawFullPage(i, tctx, 0);
        const imgData = tempCanvas.toDataURL('image/png');
        if (i > 1) {
            pdf.addPage([w, h]);
        }
        pdf.addImage(imgData, 'PNG', 0, 0, w, h);
    }

    finalPdf = pdf;
    alert('生成完成！点击"下载PDF"保存。');
}

function downloadPDF() {
    if (!finalPdf) {
        generatePDF();
        if (!finalPdf) return;
    }
    finalPdf.save('成长护照_完整版.pdf');
}

const pageConfig = {
    1: {
        bg: '成长护照_01.png',
        photo: { xRatio: 0.177, yRatio: 0.145, wRatio: 0.155, hRatio: 0.306 },
        fields: [
            { id: 'name', xRatio: 0.220, yRatio: 0.580, sizeRatio: 0.016, color: '#000000' },
            { id: 'stuId', xRatio: 0.220, yRatio: 0.710, sizeRatio: 0.0145, color: '#333333' },
            { id: 'cls', xRatio: 0.220, yRatio: 0.840, sizeRatio: 0.0145, color: '#333333' }
        ]
    },
    2: {
        bg: '成长护照_02.png',
        fields: [
            { id: 'stage1', xRatio: 0.565, yRatio: 0.240, sizeRatio: 0.0115, color: '#333333', maxWidth: 0.25, lineHeight: 1.7, baseline: 'top' },
            { id: 'stage2', xRatio: 0.565, yRatio: 0.415, sizeRatio: 0.0115, color: '#333333', maxWidth: 0.25, lineHeight: 1.7, baseline: 'top' },
            { id: 'stage3', xRatio: 0.565, yRatio: 0.590, sizeRatio: 0.0115, color: '#333333', maxWidth: 0.25, lineHeight: 1.7, baseline: 'top' },
            { id: 'stage4', xRatio: 0.565, yRatio: 0.770, sizeRatio: 0.0115, color: '#333333', maxWidth: 0.25, lineHeight: 1.7, baseline: 'top' }
        ]
    },
    3: {
        bg: '成长护照_03.png',
        fields: [
            { id: 'projectName', xRatio: 0.56, yRatio: 0.24, sizeRatio: 0.014, color: '#333333' },
            { id: 'projectTime', xRatio: 0.57, yRatio: 0.42, sizeRatio: 0.0125, color: '#333333' },
            { id: 'projectRole', xRatio: 0.57, yRatio: 0.60, sizeRatio: 0.0125, color: '#333333' },
            { id: 'projectGain', xRatio: 0.57, yRatio: 0.78, sizeRatio: 0.0115, color: '#333333', maxWidth: 0.38, lineHeight: 1.8 }
        ]
    },
    4: {
        bg: '成长护照_04.png',
        fields: [
            { id: 'shortTerm', xRatio: 0.58, yRatio: 0.34, sizeRatio: 0.0125, color: '#333333', maxWidth: 0.34, lineHeight: 1.8 },
            { id: 'longTerm', xRatio: 0.58, yRatio: 0.56, sizeRatio: 0.0125, color: '#333333', maxWidth: 0.34, lineHeight: 1.8 },
            { id: 'improvePlan', xRatio: 0.58, yRatio: 0.77, sizeRatio: 0.0125, color: '#333333', maxWidth: 0.34, lineHeight: 1.8 }
        ]
    },
    5: {
        bg: '成长护照_05.png',
        fields: [
            { id: 'y1_1', xRatio: 0.098, yRatio: 0.344, sizeRatio: 0.0078, color: '#333333', maxWidth: 0.082, lineHeight: 1.5, baseline: 'top' },
            { id: 'y1_2', xRatio: 0.196, yRatio: 0.344, sizeRatio: 0.0078, color: '#333333', maxWidth: 0.082, lineHeight: 1.5, baseline: 'top' },
            { id: 'y1_3', xRatio: 0.295, yRatio: 0.344, sizeRatio: 0.0078, color: '#333333', maxWidth: 0.082, lineHeight: 1.5, baseline: 'top' },
            { id: 'y1_4', xRatio: 0.393, yRatio: 0.344, sizeRatio: 0.0078, color: '#333333', maxWidth: 0.082, lineHeight: 1.5, baseline: 'top' },
            { id: 'y2_1', xRatio: 0.098, yRatio: 0.477, sizeRatio: 0.0078, color: '#333333', maxWidth: 0.082, lineHeight: 1.5, baseline: 'top' },
            { id: 'y2_2', xRatio: 0.196, yRatio: 0.477, sizeRatio: 0.0078, color: '#333333', maxWidth: 0.082, lineHeight: 1.5, baseline: 'top' },
            { id: 'y2_3', xRatio: 0.295, yRatio: 0.477, sizeRatio: 0.0078, color: '#333333', maxWidth: 0.082, lineHeight: 1.5, baseline: 'top' },
            { id: 'y2_4', xRatio: 0.393, yRatio: 0.477, sizeRatio: 0.0078, color: '#333333', maxWidth: 0.082, lineHeight: 1.5, baseline: 'top' },
            { id: 'y3_1', xRatio: 0.098, yRatio: 0.607, sizeRatio: 0.0078, color: '#333333', maxWidth: 0.082, lineHeight: 1.5, baseline: 'top' },
            { id: 'y3_2', xRatio: 0.196, yRatio: 0.607, sizeRatio: 0.0078, color: '#333333', maxWidth: 0.082, lineHeight: 1.5, baseline: 'top' },
            { id: 'y3_3', xRatio: 0.295, yRatio: 0.607, sizeRatio: 0.0078, color: '#333333', maxWidth: 0.082, lineHeight: 1.5, baseline: 'top' },
            { id: 'y3_4', xRatio: 0.393, yRatio: 0.607, sizeRatio: 0.0078, color: '#333333', maxWidth: 0.082, lineHeight: 1.5, baseline: 'top' },

            { id: 'y4_4', xRatio: 0.393, yRatio: 0.740, sizeRatio: 0.0078, color: '#333333', maxWidth: 0.082, lineHeight: 1.5, baseline: 'top' }
        ]

};

function loadImages() {
    const pages = [1, 2, 3, 4, 5];
    let loaded = 0;
    pages.forEach(p => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
            pageImages[p] = img;
            loaded++;
            if (loaded === pages.length) {
                drawPage(currentPage);
            }
        };
        img.onerror = () => {
            console.error('加载失败:', pageConfig[p].bg);
        };
        img.src = pageConfig[p].bg;
    });
}

function drawPage(pageNum) {
    const img = pageImages[pageNum];
    if (!img) return;
    const w = img.naturalWidth;
    const h = img.naturalHeight;
    canvas.width = w;
    canvas.height = h;
    ctx.drawImage(img, 0, 0, w, h);
    const config = pageConfig[pageNum];
    if (config.photo && userPhoto) {
        const p = config.photo;
        const px = w * p.xRatio;
        const py = h * p.yRatio;
        const pw = w * p.wRatio;
        const ph = h * p.hRatio;
        ctx.drawImage(userPhoto, px, py, pw, ph);
    }
    const fields = config.fields;
    fields.forEach(field => {
        const el = document.getElementById(field.id);
        if (!el) return;
        const text = el.value;
        if (!text) return;
        const x = w * field.xRatio;
        const y = h * field.yRatio;
        const fontSize = Math.round(w * field.sizeRatio);
        ctx.fillStyle = field.color;
        ctx.font = `normal ${fontSize}px "Microsoft YaHei", "PingFang SC", sans-serif`;
        ctx.textBaseline = field.baseline || 'bottom';
        if (field.maxWidth && field.lineHeight) {
            drawWrappedText(text, x, y, w * field.maxWidth, fontSize * field.lineHeight, fontSize, field.baseline || 'bottom');
        } else {
            ctx.fillText(text, x, y);
        }
    });
}

function drawWrappedText(text, x, y, maxWidth, lineHeight, fontSize, baseline) {
    const chars = text.split('');
    let line = '';
    let lines = [];
    for (let i = 0; i < chars.length; i++) {
        const testLine = line + chars[i];
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && line !== '') {
            lines.push(line);
            line = chars[i];
        } else {
            line = testLine;
        }
    }
    if (line) lines.push(line);
    lines.forEach((ln, i) => {
        ctx.fillText(ln, x, y + i * lineHeight);
    });
}

function drawFullPage(pageNum, targetCtx, offsetY) {
    const img = pageImages[pageNum];
    if (!img) return;
    const w = img.naturalWidth;
    const h = img.naturalHeight;
    targetCtx.drawImage(img, 0, offsetY, w, h);
    const config = pageConfig[pageNum];
    if (config.photo && userPhoto) {
        const p = config.photo;
        const px = w * p.xRatio;
        const py = offsetY + h * p.yRatio;
        const pw = w * p.wRatio;
        const ph = h * p.hRatio;
        targetCtx.drawImage(userPhoto, px, py, pw, ph);
    }
    const fields = config.fields;
    fields.forEach(field => {
        const el = document.getElementById(field.id);
        if (!el) return;
        const text = el.value;
        if (!text) return;
        const x = w * field.xRatio;
        const y = offsetY + h * field.yRatio;
        const fontSize = Math.round(w * field.sizeRatio);
        targetCtx.fillStyle = field.color;
        targetCtx.font = `normal ${fontSize}px "Microsoft YaHei", "PingFang SC", sans-serif`;
        targetCtx.textBaseline = field.baseline || 'bottom';
        if (field.maxWidth && field.lineHeight) {
            const chars = text.split('');
            let line = '';
            let lines = [];
            for (let i = 0; i < chars.length; i++) {
                const testLine = line + chars[i];
                const metrics = targetCtx.measureText(testLine);
                if (metrics.width > w * field.maxWidth && line !== '') {
                    lines.push(line);
                    line = chars[i];
                } else {
                    line = testLine;
                }
            }
            if (line) lines.push(line);
            lines.forEach((ln, i) => {
                targetCtx.fillText(ln, x, y + i * fontSize * field.lineHeight);
            });
        } else {
            targetCtx.fillText(text, x, y);
        }
    });
}

function resetAll() {
    document.querySelectorAll('input[type="text"], textarea').forEach(el => {
        el.value = '';
    });
    userPhoto = null;
    document.getElementById('photo').value = '';
    drawPage(currentPage);
}

document.querySelectorAll('.page-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.page-form').forEach(f => f.classList.add('page-hidden'));
        const page = parseInt(tab.dataset.page);
        currentPage = page;
        document.getElementById(`page${page}-form`).classList.remove('page-hidden');
        drawPage(page);
    });
});

document.querySelectorAll('input[type="text"], textarea').forEach(el => {
    el.addEventListener('input', () => {
        drawPage(currentPage);
    });
});

document.getElementById('photo').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
            userPhoto = img;
            drawPage(currentPage);
        };
        img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
});

document.querySelectorAll('input[type="text"], textarea').forEach(el => {
    el.value = '';
});

setTimeout(() => {
    document.querySelectorAll('input[type="text"], textarea').forEach(el => {
        el.value = '';
    });
}, 100);

setTimeout(() => {
    document.querySelectorAll('input[type="text"], textarea').forEach(el => {
        el.value = '';
    });
}, 500);

loadImages();
</script>
</body>
</html>
